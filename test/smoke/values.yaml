# The chart has no per-component registry: every image uses global.registry.
scheduler:
  image:
    name: ukai-scheduler
    tag: smoke
    pullPolicy: Never
  plugins:
    tierbudget:
      priority: 50
      arguments:
        mode: enforce
        ownerLabel: example.com/owner
        budgetedClasses: test-high
        promotableClasses: test-mid
        budget: "2"
        allowance: "2"
        promotedPriority: "75"
        excessPriority: "45"
        # A P1 may move P1; nothing else may.
        consolidation: "test-high > test-high,test-mid,test-low; test-mid,test-low > test-mid,test-low"
  # KAI's own would also move P1 to place P3.
  actions:
    consolidation:
      enabled: false
    ukai-consolidation:
      enabled: true
      priority: 400
