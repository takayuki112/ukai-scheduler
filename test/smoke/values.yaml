# The chart has no per-component registry: every image uses global.registry.
scheduler:
  image:
    name: ukai-scheduler
    tag: smoke
    pullPolicy: Never
  plugins:
    tierbudget:
      priority: 50
      arguments:
        mode: enforce
        ownerLabel: example.com/owner
        budgetedClasses: test-high
        promotableClasses: test-mid
        budget: "2"
        allowance: "2"
        promotedPriority: "75"
        excessPriority: "45"
