name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./...
  cluster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test/e2e/run.sh
          - test/setups/run.sh
          - test/upgrade/run.sh
          - test/failure/run.sh
          - KYVERNO_CHART=3.7.0 POLICIES=examples/kyverno test/kyverno/run.sh
          - KYVERNO_CHART=3.10.0 POLICIES=examples/kyverno-cel test/kyverno/run.sh
    env:
      CLUSTER: ukai-dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum | awk '{print $1"  kind"}' | sha256sum -c -
          sudo install kind /usr/local/bin/kind
      - run: KEEP=1 ./test/smoke/run.sh
      - run: ${{ matrix.suite }}
