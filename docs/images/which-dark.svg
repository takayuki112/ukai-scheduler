<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" role="img"><title>Which class to choose</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:15px}</style><rect width="600" height="310" rx="10" fill="#0d1117"/><rect x="55" y="23" width="190" height="58" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="150" y="47" fill="#f0f6fc" text-anchor="middle">Need it soon, and</text><text x="150" y="67" fill="#f0f6fc" text-anchor="middle">is it small?</text><rect x="335" y="23" width="230" height="58" rx="8" fill="#1f6feb" stroke="#1f6feb" stroke-width="1.5"/><text x="450" y="47" fill="#ffffff" text-anchor="middle" font-weight="600">P1</text><text x="450" y="67" fill="#ffffff" text-anchor="middle">counts against your budget</text><rect x="55" y="129" width="190" height="58" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="150" y="153" fill="#f0f6fc" text-anchor="middle">Would losing progress</text><text x="150" y="173" fill="#f0f6fc" text-anchor="middle">hurt?</text><rect x="335" y="119" width="230" height="78" rx="8" fill="#8957e5" stroke="#8957e5" stroke-width="1.5"/><text x="450" y="143" fill="#ffffff" text-anchor="middle" font-weight="600">P2</text><text x="450" y="163" fill="#ffffff" text-anchor="middle">promoted while your</text><text x="450" y="183" fill="#ffffff" text-anchor="middle">budget is unused</text><rect x="55" y="235" width="190" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="150" y="259" fill="#f0f6fc" text-anchor="middle" font-weight="600">P3</text><text x="150" y="279" fill="#f0f6fc" text-anchor="middle">whatever is free</text><polyline points="245,52 335,52" fill="none" stroke="#9198a1" stroke-width="1.5"/><path d="M335,52 L327,57 L327,47 z" fill="#9198a1"/><text x="290" y="44" fill="#9198a1" text-anchor="middle">yes</text><polyline points="150,81 150,129" fill="none" stroke="#9198a1" stroke-width="1.5"/><path d="M150,129 L155,121 L145,121 z" fill="#9198a1"/><text x="160" y="109" fill="#9198a1" text-anchor="start">no</text><polyline points="245,158 335,158" fill="none" stroke="#9198a1" stroke-width="1.5"/><path d="M335,158 L327,163 L327,153 z" fill="#9198a1"/><text x="290" y="150" fill="#9198a1" text-anchor="middle">yes</text><polyline points="150,187 150,235" fill="none" stroke="#9198a1" stroke-width="1.5"/><path d="M150,235 L155,227 L145,227 z" fill="#9198a1"/><text x="160" y="215" fill="#9198a1" text-anchor="start">no</text></svg>
