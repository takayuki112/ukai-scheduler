y:0}}.a43{animation-name:k43}@keyframes k44{0.000%{fill:#da3633}69.333%{fill:#da3633}70.667%{fill:#1f6feb}100.000%{fill:#1f6feb}}.a44{animation-name:k44}@keyframes k45{0.000%{opacity:0}27.778%{opacity:0}28.667%{opacity:1}68.667%{opacity:1}69.333%{opacity:0}100.000%{opacity:0}}.a45{animation-name:k45}@keyframes k46{0.000%{opacity:0}69.333%{opacity:0}70.222%{opacity:1}100.000%{opacity:1}}.a46{animation-name:k46}@media(prefers-reduced-motion:reduce){.a{animation-play-state:paused!important;animation-delay:-22.099999999999998s!important}}</style><rect width="880" height="468" rx="10" fill="#0d1117"/><g class="a a1"><text x="30" y="34" font-size="15" fill="#9198a1" text-anchor="start" font-weight="600">Step 1 of 6</text><text x="30" y="68" font-size="26" fill="#f0f6fc" text-anchor="start" font-weight="600">Alice starts a P2 job on 4 GPUs</text><text x="30" y="97" font-size="18" fill="#9198a1" text-anchor="start">Alice's budget is unused, so the running job is promoted to P1 priority.</text></g><rect x="560" y="26" width="43" height="6" rx="3" fill="#3d444d"/><g transform="translate(560 26)"><rect width="43" height="6" rx="3" fill="#f0f6fc" class="a a2"/></g><g class="a a3"><text x="30" y="34" font-size="15" fill="#9198a1" text-anchor="start" font-weight="600">Step 2 of 6</text><text x="30" y="68" font-size="26" fill="#f0f6fc" text-anchor="start" font-weight="600">Bob starts a P1 job on 4 GPUs</text><text x="30" y="97" font-size="18" fill="#9198a1" text-anchor="start">It fits Bob's budget of 4.</text></g><rect x="609" y="26" width="43" height="6" rx="3" fill="#3d444d"/><g transform="translate(609 26)"><rect width="43" height="6" rx="3" fill="#f0f6fc" class="a a4"/></g><g class="a a5"><text x="30" y="34" font-size="15" fill="#9198a1" text-anchor="start" font-weight="600">Step 3 of 6</text><text x="30" y="68" font-size="26" fill="#f0f6fc" text-anchor="start" font-weight="600">Bob submits another P1 job</text><text x="30" y="97" font-size="18" fill="#9198a1" text-anchor="start">Bob's budget is used up, so it is held. It evicts nobody.</text></g><rect x="658" y="26" width="43" height="6" rx="3" fill="#3d444d"/><g transform="translate(658 26)"><rect width="43" height="6" rx="3" fill="#f0f6fc" class="a a6"/></g><g class="a a7"><text x="30" y="34" font-size="15" fill="#9198a1" text-anchor="start" font-weight="600">Step 4 of 6</text><text x="30" y="68" font-size="26" fill="#f0f6fc" text-anchor="start" font-weight="600">Alice submits a P1 job on 4 GPUs</text><text x="30" y="97" font-size="18" fill="#9198a1" text-anchor="start">It takes Alice's budget back: Alice's own P2 is demoted, and makes room.</text></g><rect x="707" y="26" width="43" height="6" rx="3" fill="#3d444d"/><g transform="translate(707 26)"><rect width="43" height="6" rx="3" fill="#f0f6fc" class="a a8"/></g><g class="a a9"><text x="30" y="34" font-size="15" fill="#9198a1" text-anchor="start" font-weight="600">Step 5 of 6</text><text x="30" y="68" font-size="26" fill="#f0f6fc" text-anchor="start" font-weight="600">Bob's first job ends</text><text x="30" y="97" font-size="18" fill="#9198a1" text-anchor="start">Now Bob's second P1 fits the budget, and starts. 2 free GPUs are too few for train.</text></g><rect x="756" y="26" width="43" height="6" rx="3" fill="#3d444d"/><g transform="translate(756 26)"><rect width="43" height="6" rx="3" fill="#f0f6fc" class="a a10"/></g><g class="a a11"><text x="30" y="34" font-size="15" fill="#9198a1" text-anchor="start" font-weight="600">Step 6 of 6</text><text x="30" y="68" font-size="26" fill="#f0f6fc" text-anchor="start" font-weight="600">Bob's second job ends too</text><text x="30" y="97" font-size="18" fill="#9198a1" text-anchor="start">Idle GPUs go to anyone: Alice's P2 runs again, as excess.</text></g><rect x="805" y="26" width="43" height="6" rx="3" fill="#3d444d"/><g transform="translate(805 26)"><rect width="43" height="6" rx="3" fill="#f0f6fc" class="a a12"/></g><text x="30" y="164" font-size="19" fill="#f0f6fc" text-anchor="start" fon