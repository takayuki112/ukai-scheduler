udget: 0 of 4 used</text></g><g class="a a18"><text x="30" y="315" font-size="15" fill="#9198a1" text-anchor="start">budget: lent to train</text></g><g class="a a19"><text x="30" y="315" font-size="15" fill="#9198a1" text-anchor="start">budget: kept for debug</text></g><g class="a a20"><text x="30" y="315" font-size="15" fill="#9198a1" text-anchor="start">budget: 4 of 4 used</text></g><rect x="30" y="375" width="33" height="14" rx="4" stroke="#3d444d" stroke-width="1.5" class="a a21"/><rect x="67" y="375" width="33" height="14" rx="4" stroke="#3d444d" stroke-width="1.5" class="a a22"/><rect x="104" y="375" width="33" height="14" rx="4" stroke="#3d444d" stroke-width="1.5" class="a a23"/><rect x="141" y="375" width="33" height="14" rx="4" stroke="#3d444d" stroke-width="1.5" class="a a24"/><g class="a a25"><text x="30" y="409" font-size="15" fill="#9198a1" text-anchor="start">budget: 0 of 4 used</text></g><g class="a a26"><text x="30" y="409" font-size="15" fill="#9198a1" text-anchor="start">budget: 4 of 4 used</text></g><g class="a a27"><text x="30" y="409" font-size="15" fill="#9198a1" text-anchor="start">budget: 0 of 4 used</text></g><g class="a a28"><text x="30" y="409" font-size="15" fill="#9198a1" text-anchor="start">budget: 2 of 4 used</text></g><g class="a a29"><text x="30" y="409" font-size="15" fill="#9198a1" text-anchor="start">budget: 0 of 4 used</text></g><g class="a a30"><g class="a a31"><rect x="-1" y="-1" width="316" height="74" rx="9" style="fill:#1f6feb"/><text x="14" y="31" font-size="19" fill="#ffffff" text-anchor="start" font-weight="600">Bob: eval</text><g class="a a32"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P1, within budget, priority 75</text></g></g></g><g class="a a33"><g class="a a34"><rect x="-1" y="-1" width="316" height="74" rx="9" class="a a35"/><text x="14" y="31" font-size="19" fill="#ffffff" text-anchor="start" font-weight="600">Alice: train</text><g class="a a36"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P2, beyond the allowance of 2</text></g><g class="a a37"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P2, promoted, priority 75</text></g><g class="a a38"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P2, excess, priority 45</text></g></g></g><g class="a a39"><g class="a a40"><rect x="-1" y="-1" width="316" height="74" rx="9" style="fill:#1f6feb"/><text x="14" y="31" font-size="19" fill="#ffffff" text-anchor="start" font-weight="600">Alice: debug</text><g class="a a41"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P1, within budget, priority 75</text></g></g></g><g class="a a42"><g class="a a43"><rect x="-1" y="-1" width="156" height="74" rx="9" class="a a44"/><text x="14" y="31" font-size="19" fill="#ffffff" text-anchor="start" font-weight="600">Bob: eval2</text><g class="a a45"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P1, held</text></g><g class="a a46"><text x="14" y="55" font-size="15" fill="#ffffff" text-anchor="start">P1, in budget</text></g></g></g><rect x="30" y="439" width="16" height="16" rx="4" fill="#1f6feb"/><text x="54" y="452" font-size="15" fill="#9198a1" text-anchor="start">P1 within budget</text><rect x="206" y="439" width="16" height="16" rx="4" fill="#8957e5"/><text x="230" y="452" font-size="15" fill="#9198a1" text-anchor="start">P2 promoted: as safe as P1</text><rect x="458" y="439" width="16" height="16" rx="4" fill="#9e6a03"/><text x="482" y="452" font-size="15" fill="#9198a1" text-anchor="start">P2 excess: gives way first</text><rect x="696" y="439" width="16" height="16" rx="4" fill="#da3633"/><text x="720" y="452" font-size="15" fill="#9198a1" text-anchor="start">P1 held</text></svg>
