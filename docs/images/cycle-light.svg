<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img"><title>One cycle, as a sequence of calls</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:15px}</style><rect width="700" height="560" rx="10" fill="#ffffff"/><polyline points="85,45 85,545" fill="none" stroke="#d1d9e0" stroke-width="1.5"/><rect x="25" y="11" width="120" height="38" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="85" y="35" fill="#1f2328" text-anchor="middle" font-weight="600">KAI</text><polyline points="390,45 390,545" fill="none" stroke="#d1d9e0" stroke-width="1.5"/><rect x="330" y="11" width="120" height="38" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="390" y="35" fill="#1f2328" text-anchor="middle" font-weight="600">tierbudget</text><polyline points="625,45 625,545" fill="none" stroke="#d1d9e0" stroke-width="1.5"/><rect x="565" y="11" width="120" height="38" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="625" y="35" fill="#1f2328" text-anchor="middle" font-weight="600">tiers.Assign</text><polyline points="85,68 109,68 109,92 85,92" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M85,92 L93,87 L93,97 z" fill="#59636e"/><text x="119" y="85" fill="#1f2328" text-anchor="start">snapshot of the cluster</text><polyline points="85,134 390,134" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M390,134 L382,139 L382,129 z" fill="#59636e"/><text x="237" y="126" fill="#1f2328" text-anchor="middle">OnSessionOpen</text><text x="507" y="160" fill="#1f2328" text-anchor="middle">jobs: user, class,</text><polyline points="390,188 625,188" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M625,188 L617,193 L617,183 z" fill="#59636e"/><text x="507" y="180" fill="#1f2328" text-anchor="middle">units, running, times</text><polyline points="625,226 390,226" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M390,226 L398,221 L398,231 z" fill="#59636e"/><text x="507" y="218" fill="#1f2328" text-anchor="middle">tier and priority of each</text><polyline points="390,250 414,250 414,274 390,274" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M390,274 L398,269 L398,279 z" fill="#59636e"/><text x="424" y="267" fill="#1f2328" text-anchor="start">publish metrics and status</text><text x="237" y="306" fill="#1f2328" text-anchor="middle">in enforce mode: set in-memory</text><polyline points="390,334 85,334" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M85,334 L93,329 L93,339 z" fill="#59636e"/><text x="237" y="326" fill="#1f2328" text-anchor="middle">priorities, add hooks</text><rect x="45" y="356" width="385" height="128" rx="10" fill="none" stroke="#59636e" stroke-width="1.5"/><text x="237" y="376" fill="#59636e" text-anchor="middle" font-weight="600">loop: allocate, consolidate,</text><text x="237" y="396" fill="#59636e" text-anchor="middle" font-weight="600">reclaim, preempt</text><polyline points="85,432 390,432" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M390,432 L382,437 L382,427 z" fill="#59636e"/><text x="237" y="424" fill="#1f2328" text-anchor="middle">may this task be placed?</text><polyline points="390,470 85,470" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M85,470 L93,465 L93,475 z" fill="#59636e"/><text x="237" y="462" fill="#1f2328" text-anchor="middle">no, with a reason, if over budget now</text><polyline points="85,524 390,524" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M390,524 L382,529 L382,519 z" fill="#59636e"/><text x="237" y="516" fill="#1f2328" text-anchor="middle">OnSessionClose</text></svg>
