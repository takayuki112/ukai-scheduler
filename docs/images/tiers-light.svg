<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 630" width="700" height="630" role="img"><title>How a job gets its tier</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:15px}</style><rect width="700" height="630" rx="10" fill="#ffffff"/><rect x="310" y="13" width="80" height="38" rx="19" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="350" y="37" fill="#1f2328" text-anchor="middle">Job</text><rect x="255" y="89" width="190" height="58" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="350" y="113" fill="#1f2328" text-anchor="middle">Has GPUs, and its</text><text x="350" y="133" fill="#1f2328" text-anchor="middle">class is listed?</text><rect x="532" y="89" width="140" height="58" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="602" y="113" fill="#1f2328" text-anchor="middle" font-weight="600">unmanaged</text><text x="602" y="133" fill="#1f2328" text-anchor="middle">as in stock KAI</text><rect x="305" y="189" width="90" height="38" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="350" y="213" fill="#1f2328" text-anchor="middle">Class</text><polyline points="350,51 350,89" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M350,89 L355,81 L345,81 z" fill="#59636e"/><polyline points="445,118 532,118" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M532,118 L524,123 L524,113 z" fill="#59636e"/><text x="488" y="110" fill="#59636e" text-anchor="middle">no</text><polyline points="350,147 350,189" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M350,189 L355,181 L345,181 z" fill="#59636e"/><text x="360" y="173" fill="#59636e" text-anchor="start">yes</text><polyline points="305,208 80,208 80,281" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M80,281 L85,273 L75,273 z" fill="#59636e"/><text x="88" y="252" fill="#59636e" text-anchor="start">charged</text><polyline points="350,227 350,240 270,240 270,281" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M270,281 L275,273 L265,273 z" fill="#59636e"/><text x="278" y="262" fill="#59636e" text-anchor="start">budgeted</text><polyline points="395,208 540,208 540,281" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M540,281 L545,273 L535,273 z" fill="#59636e"/><text x="548" y="252" fill="#59636e" text-anchor="start">promotable</text><rect x="30" y="281" width="100" height="38" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/><text x="80" y="305" fill="#ffffff" text-anchor="middle" font-weight="600">budget</text><rect x="215" y="281" width="110" height="38" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270" y="305" fill="#1f2328" text-anchor="middle">Running?</text><rect x="30" y="381" width="100" height="38" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/><text x="80" y="405" fill="#ffffff" text-anchor="middle" font-weight="600">budget</text><polyline points="215,300 170,300 170,400 130,400" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M130,400 L138,395 L138,405 z" fill="#59636e"/><text x="178" y="358" fill="#59636e" text-anchor="start">yes</text><rect x="180" y="371" width="180" height="58" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270" y="395" fill="#1f2328" text-anchor="middle">Fits the budget, after</text><text x="270" y="415" fill="#1f2328" text-anchor="middle">what the user runs?</text><polyline points="270,319 270,371" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M270,371 L275,363 L265,363 z" fill="#59636e"/><text x="280" y="350" fill="#59636e" text-anchor="start">no</text><rect x="95" y="481" width="110" height="58" rx="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/><text x="150" y="505" fill="#ffffff" text-anchor="middle" font-weight="600">budget</text><text x="150" y="525" fill="#ffffff" text-anchor="middle">may start</text><rect x="245" y="481" width="130" height="58" rx="8" fill="#cf222e" stroke="#cf222e" stroke-width="1.5"/><text x="310" y="505" fill="#ffffff" text-anchor="middle" font-weight="600">held</text><text x="310" y="525" fill="#ffffff" text-anchor="middle">waits, says why</text><polyline points="220,429 220,450 150,450 150,481" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M150,481 L155,473 L145,473 z" fill="#59636e"/><text x="158" y="472" fill="#59636e" text-anchor="start">yes</text><polyline points="310,429 310,481" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M310,481 L315,473 L305,473 z" fill="#59636e"/><text x="318" y="472" fill="#59636e" text-anchor="start">no</text><rect x="485" y="281" width="110" height="38" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="540" y="305" fill="#1f2328" text-anchor="middle">Running?</text><rect x="390" y="371" width="160" height="58" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="470" y="395" fill="#1f2328" text-anchor="middle">Fits what is left</text><text x="470" y="415" fill="#1f2328" text-anchor="middle">of the budget?</text><polyline points="500,319 500,371" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M500,371 L505,363 L495,363 z" fill="#59636e"/><text x="492" y="350" fill="#59636e" text-anchor="end">yes</text><rect x="395" y="481" width="110" height="58" rx="8" fill="#8250df" stroke="#8250df" stroke-width="1.5"/><text x="450" y="505" fill="#ffffff" text-anchor="middle" font-weight="600">promoted</text><text x="450" y="525" fill="#ffffff" text-anchor="middle">P1 priority</text><polyline points="430,429 430,481" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M430,481 L435,473 L425,473 z" fill="#59636e"/><text x="438" y="472" fill="#59636e" text-anchor="start">yes</text><rect x="535" y="466" width="130" height="58" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="600" y="490" fill="#1f2328" text-anchor="middle">Fits the</text><text x="600" y="510" fill="#1f2328" text-anchor="middle">allowance?</text><polyline points="550,410 580,410 580,466" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M580,466 L585,458 L575,458 z" fill="#59636e"/><text x="588" y="440" fill="#59636e" text-anchor="start">no</text><polyline points="595,300 640,300 640,466" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M640,466 L645,458 L635,458 z" fill="#59636e"/><text x="632" y="350" fill="#59636e" text-anchor="end">no</text><rect x="400" y="565" width="160" height="58" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="480" y="589" fill="#1f2328" text-anchor="middle" font-weight="600">normal</text><text x="480" y="609" fill="#1f2328" text-anchor="middle">keeps its priority</text><rect x="570" y="565" width="120" height="58" rx="8" fill="#9a6700" stroke="#9a6700" stroke-width="1.5"/><text x="630" y="589" fill="#ffffff" text-anchor="middle" font-weight="600">excess</text><text x="630" y="609" fill="#ffffff" text-anchor="middle">lower priority</text><polyline points="565,524 565,544 530,544 530,565" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M530,565 L535,557 L525,557 z" fill="#59636e"/><text x="522" y="558" fill="#59636e" text-anchor="end">yes</text><polyline points="635,524 635,565" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M635,565 L640,557 L630,557 z" fill="#59636e"/><text x="643" y="550" fill="#59636e" text-anchor="start">no</text></svg>
