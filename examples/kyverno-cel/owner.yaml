apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: keep-owner
spec:
  validationActions: [Deny] # Audit first
  evaluation: {background: {enabled: false}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: ["*"], resources: [pods], operations: [UPDATE]}
      - {apiGroups: [batch], apiVersions: ["*"], resources: [jobs, cronjobs], operations: [UPDATE]}
      - {apiGroups: [apps], apiVersions: ["*"], resources: [deployments, statefulsets, replicasets], operations: [UPDATE]}
  matchConditions:
    - name: users
      expression: "!request.userInfo.username.startsWith('system:')"
  validations:
    - message: the user label cannot be changed
      expression: >-
        (has(object.metadata) && has(object.metadata.labels) && 'example.com/owner' in object.metadata.labels ? object.metadata.labels['example.com/owner'] : '') == (has(oldObject.metadata) && has(oldObject.metadata.labels) && 'example.com/owner' in oldObject.metadata.labels ? oldObject.metadata.labels['example.com/owner'] : '')
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: keep-owner-in-templates
spec:
  validationActions: [Deny] # Audit first
  evaluation: {background: {enabled: false}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [batch], apiVersions: ["*"], resources: [jobs], operations: [UPDATE]}
      - {apiGroups: [apps], apiVersions: ["*"], resources: [deployments, statefulsets, replicasets], operations: [UPDATE]}
  matchConditions:
    - name: users
      expression: "!request.userInfo.username.startsWith('system:')"
  validations:
    - message: the user label cannot be changed
      expression: >-
        (has(object.spec) && has(object.spec.template) && has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && 'example.com/owner' in object.spec.template.metadata.labels ? object.spec.template.metadata.labels['example.com/owner'] : '') == (has(oldObject.spec) && has(oldObject.spec.template) && has(oldObject.spec.template.metadata) && has(oldObject.spec.template.metadata.labels) && 'example.com/owner' in oldObject.spec.template.metadata.labels ? oldObject.spec.template.metadata.labels['example.com/owner'] : '')
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: keep-owner-in-cronjobs
spec:
  validationActions: [Deny] # Audit first
  evaluation: {background: {enabled: false}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [batch], apiVersions: ["*"], resources: [cronjobs], operations: [UPDATE]}
  matchConditions:
    - name: users
      expression: "!request.userInfo.username.startsWith('system:')"
  validations:
    - message: the user label cannot be changed
      expression: >-
        (has(object.spec) && has(object.spec.jobTemplate) && has(object.spec.jobTemplate.metadata) && has(object.spec.jobTemplate.metadata.labels) && 'example.com/owner' in object.spec.jobTemplate.metadata.labels ? object.spec.jobTemplate.metadata.labels['example.com/owner'] : '') == (has(oldObject.spec) && has(oldObject.spec.jobTemplate) && has(oldObject.spec.jobTemplate.metadata) && has(oldObject.spec.jobTemplate.metadata.labels) && 'example.com/owner' in oldObject.spec.jobTemplate.metadata.labels ? oldObject.spec.jobTemplate.metadata.labels['example.com/owner'] : '')
    - message: the user label cannot be changed
      expression: >-
        (has(object.spec) && has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.metadata) && has(object.spec.jobTemplate.spec.template.metadata.labels) && 'example.com/owner' in object.spec.jobTemplate.spec.template.metadata.labels ? object.spec.jobTemplate.spec.template.metadata.labels['example.com/owner'] : '') == (has(oldObject.spec) && has(oldObject.spec.jobTemplate) && has(oldObject.spec.jobTemplate.spec) && has(oldObject.spec.jobTemplate.spec.template) && has(oldObject.spec.jobTemplate.spec.template.metadata) && has(oldObject.spec.jobTemplate.spec.template.metadata.labels) && 'example.com/owner' in oldObject.spec.jobTemplate.spec.template.metadata.labels ? oldObject.spec.jobTemplate.spec.template.metadata.labels['example.com/owner'] : '')
---
# So that jobs are rejected, not let through, if the label could not be set.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: check-owner
spec:
  validationActions: [Deny] # Audit first
  evaluation: {background: {enabled: false}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: ["*"], resources: [pods], operations: [CREATE]}
      - {apiGroups: [batch], apiVersions: ["*"], resources: [jobs, cronjobs], operations: [CREATE]}
      - {apiGroups: [apps], apiVersions: ["*"], resources: [deployments, statefulsets, replicasets], operations: [CREATE]}
  matchConditions:
    - name: users
      expression: "!request.userInfo.username.startsWith('system:')"
  variables:
    - name: owner
      expression: "request.userInfo.username.replace('@', '-at-')"
    - name: template
      expression: >-
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template :
        has(object.spec.template) ? object.spec.template : object
  validations:
    - message: the user label must name who submits
      expression: >-
        has(object.metadata.labels) && 'example.com/owner' in object.metadata.labels &&
        object.metadata.labels['example.com/owner'] == variables.owner
    - message: the user label of the pod template must name who submits
      expression: >-
        has(variables.template.metadata) && has(variables.template.metadata.labels) &&
        'example.com/owner' in variables.template.metadata.labels &&
        variables.template.metadata.labels['example.com/owner'] == variables.owner
