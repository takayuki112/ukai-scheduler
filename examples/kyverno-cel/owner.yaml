# As in ../kyverno/owner.yaml, for Kyverno 1.20 or later: see there what to adapt.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-owner-pods
spec:
  evaluation: {admission: {enabled: true}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: ["*"], resources: [pods], operations: [CREATE]}
  matchConditions:
    - name: users
      expression: "!request.userInfo.username.startsWith('system:')"
  variables:
    - name: owner
      expression: "request.userInfo.username.replace('@', '-at-')"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.metadata) && has(object.metadata.labels) ? [] : [JSONPatch{op: 'add', path: '/metadata/labels', value: Object.metadata.labels{}}]) +
          [JSONPatch{op: 'add', path: '/metadata/labels/example.com~1owner', value: variables.owner}]
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-owner-workloads
spec:
  evaluation: {admission: {enabled: true}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [batch], apiVersions: ["*"], resources: [jobs], operations: [CREATE]}
      - {apiGroups: [apps], apiVersions: ["*"], resources: [deployments, statefulsets, replicasets], operations: [CREATE]}
  matchConditions:
    - name: users
      expression: "!request.userInfo.username.startsWith('system:')"
  variables:
    - name: owner
      expression: "request.userInfo.username.replace('@', '-at-')"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.metadata) && has(object.metadata.labels) ? [] : [JSONPatch{op: 'add', path: '/metadata/labels', value: Object.metadata.labels{}}]) +
          [JSONPatch{op: 'add', path: '/metadata/labels/example.com~1owner', value: variables.owner}] +
          (has(object.spec.template.metadata) ? [] : [JSONPatch{op: 'add', path: '/spec/template/metadata', value: Object.spec.template.metadata{}}]) +
          (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ? [] : [JSONPatch{op: 'add', path: '/spec/template/metadata/labels', value: Object.spec.template.metadata.labels{}}]) +
