# As in ../kyverno/grace-period.yaml, for Kyverno 1.20 or later. Checks pods, and the
# templates of built-in workloads, so that people learn of it when they submit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cap-grace-period
spec:
  validationActions: [Deny] # Audit first
  evaluation: {background: {enabled: false}}
  autogen: {podControllers: {controllers: []}}
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: ["*"], resources: [pods], operations: [CREATE]}
      - {apiGroups: [batch], apiVersions: ["*"], resources: [jobs, cronjobs], operations: [CREATE, UPDATE]}
      - {apiGroups: [apps], apiVersions: ["*"], resources: [deployments, statefulsets, replicasets], operations: [CREATE, UPDATE]}
  variables:
    - name: pod
      expression: >-
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        has(object.spec.template) ? object.spec.template.spec : object.spec
  validations:
    - message: terminationGracePeriodSeconds may be at most 300
      expression: >-
        !has(variables.pod.terminationGracePeriodSeconds) || variables.pod.terminationGracePeriodSeconds <= 300
